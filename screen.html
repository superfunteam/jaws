<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1-bit Jaws</title>

    <!-- PWA & Favicon -->
    <link rel="manifest" href="https://jaws.superfun.games/manifest.json">
    <link rel="icon" href="https://jaws.superfun.games/favicon.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="https://jaws.superfun.games/touch-icon.png">
    <meta name="theme-color" content="#00d6f2">

    <!-- Unfurl/Open Graph Meta Tags -->
    <meta property="og:title" content="1-bit Jaws">
    <meta property="og:description" content="Celebrate the 50th anniversary of Jaws, one frame at a time.">
    <meta property="og:image" content="https://jaws.superfun.games/unfurl.png"> 
    <meta property="og:url" content="https://jaws.superfun.games/"> <!-- Assuming this is your site URL -->
    <meta property="og:type" content="website">

    <!-- Twitter Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="1-bit Jaws">
    <meta name="twitter:description" content="Celebrate the 50th anniversary of Jaws, one frame at a time.">
    <meta name="twitter:image" content="https://jaws.superfun.games/unfurl.png">
    <meta name="twitter:site" content="@clarklab">
    <meta name="twitter:creator" content="@clarklab">

    <style>
        /* Custom styles for better visual appeal if needed */
        body {
            font-family: 'Inter Tight', sans-serif; /* Using Inter font as preferred */
        }
        /* Ensure the html and body take full height for centering */
        html, body {
            height: 100%;
            margin: 0;
        }
        body a{
            text-decoration: underline;
        }
    </style>
    <!-- Time-based frame logic. Loaded in <head> so the correct frame can be
         set before first paint (prevents any wrong frame from flashing). -->
    <script src="frame.js"></script>
</head>
<body style="background:black;">

    <main style="width:100%;">
        <div style="width:100%;">
            <!-- No src here on purpose: the correct frame is set by the inline
                 script below before the browser paints, so a placeholder/other
                 frame never flashes. -->
            <img id="sequenceImage" alt="Current Sequenced Image" style="width:800px; height:auto;" onclick="toggleFullscreen(this)">
            <script>
                const img = document.getElementById('sequenceImage');

                // The frame is derived from the clock, so the screen never needs
                // a redeploy to show the right image. Set the correct frame now
                // (before paint) and swap to the next one exactly when it changes.
                function showCurrentFrame() {
                    img.src = JawsFrame.frameUrl();
                }
                function scheduleNextFrame() {
                    setTimeout(() => {
                        showCurrentFrame();
                        scheduleNextFrame();
                    }, JawsFrame.msUntilNextFrame() + 1000);
                }
                showCurrentFrame();
                scheduleNextFrame();

                img.onerror = function() {
                    // Fallback if the image fails to load
                    img.alt = "Image currently unavailable. Please check back soon.";
                };

                // Fullscreen toggle function
                function toggleFullscreen(element) {
                    if (!document.fullscreenElement) {
                        // Enter fullscreen
                        if (element.requestFullscreen) {
                            element.requestFullscreen();
                        } else if (element.webkitRequestFullscreen) { // Safari
                            element.webkitRequestFullscreen();
                        } else if (element.msRequestFullscreen) { // IE11
                            element.msRequestFullscreen();
                        }
                    } else {
                        // Exit fullscreen
                        if (document.exitFullscreen) {
                            document.exitFullscreen();
                        } else if (document.webkitExitFullscreen) { // Safari
                            document.webkitExitFullscreen();
                        } else if (document.msExitFullscreen) { // IE11
                            document.msExitFullscreen();
                        }
                    }
                }
            </script>
            <script>
                // Frames now swap in place at each 15-minute boundary, so a
                // frequent reload is no longer needed. Reload hourly only to
                // pick up any site updates.
                setTimeout(() => {
                    window.location.reload();
                }, 60 * 60 * 1000); // 1 hour in milliseconds
            </script>
        </div>

        
    </main>

</body>
</html>
